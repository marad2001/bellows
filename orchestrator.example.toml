# Bellows orchestrator config (example).
#
# Copy this file to `orchestrator.toml` and fill in the values that match
# your environment. The real `orchestrator.toml` is gitignored so you can
# keep deployment-specific values out of source control.

# Repos to poll. Two shapes are accepted; pick whichever fits your setup.
#
# ── Shape A: single repo (legacy `[repo]` table form) ──────────────
#
# [repo]
# url = "https://github.com/marad2001/bellows-test"
#
# ── Shape B: multiple repos (`[[repo]]` array-of-tables form, added
#    by issue #35) ────────────────────────────────────────────────
#
# One `[[repo]]` block per repo. The polling loop walks every entry on
# each tick and claims the OLDEST `ready-for-agent` issue across the
# combined set (by GitHub `created_at`). Concurrency stays at 1
# regardless of how many repos are configured — bellows still runs at
# most one agent container at a time.
#
# The example below shows the array-of-tables shape; pick this one if
# you intend to poll more than one repo. Drop down to the single
# `[repo]` form above if you only have one.

[[repo]]
url = "https://github.com/marad2001/bellows-test"
# Optional. Per-repo opt-in for SSH deploy keys (ADR-0002 / issue #69)
# — when this list is non-empty, the agent and cargo-checks gate
# containers spawned for THIS repo get the `[auth].ssh_keys_volume`
# mounted read-only at `/home/bellows/.ssh/` so cargo can fetch
# private git deps via `ssh://git@github.com/...` URLs. Each entry is
# a key NAME (the same name passed to `bellows setup-deploy-keys
# add`); bellows refuses to start when any name listed here is not
# present in the volume. Omit / leave empty for repos that don't need
# private-dep access — that preserves the "no creds in sandbox by
# default" posture.
# deploy_keys = ["workboard-core"]

# [[repo]]
# url = "https://github.com/marad2001/another-repo"

[github]
# Name of the environment variable holding your fine-grained PAT.
# The PAT needs: Issues: write, Pull requests: write, Contents: write.
# A single PAT is shared across every configured repo — per-repo
# credentials are out of scope for issue #35.
pat_env_var = "BELLOWS_GITHUB_TOKEN"

# All sections below are optional; defaults shown are what you get if
# you omit the section entirely.

[polling]
# How often to poll GitHub. Default: 45 seconds.
interval_seconds = 30
# Which label marks an issue as ready for an AFK agent to pick up.
pickup_label = "ready-for-agent"

[runtime_labels]
# Strings Bellows applies during a run. Defaults match these names verbatim.
agent_in_progress = "agent-in-progress"
agent_done        = "agent-done"
agent_failed      = "agent-failed"
agent_rate_limited = "agent-rate-limited"
agent_cancelled   = "agent-cancelled"

[logging]
# Single log file path. Default: "bellows.log" in cwd.
path = "bellows.log"
# Append-only per-run metrics file: one JSON object per finished run,
# on one line, appended at finalisation and never rewritten. Carries the
# engine/model and duration of each phase that ran, the exit
# classification, and the merger's verdict. Default: "runs.jsonl" in cwd.
# Writing it is best-effort — a failure warns on the log and leaves the
# run's outcome untouched.
metrics_path = "runs.jsonl"

[auth]
# Auth method for the in-container agent. Only `"subscription"` is
# implemented in v1.
method = "subscription"
# Docker volume holding per-repo SSH deploy keys (ADR-0002 /
# issue #69). Populated via `bellows setup-deploy-keys add <name>`
# and mounted read-only at `/home/bellows/.ssh/` into agent and
# cargo-checks containers spawned for `[[repo]]` blocks whose
# `deploy_keys = [...]` list is non-empty. Parallel to but distinct
# from the per-engine credentials volumes below — separate lifecycle,
# separate setup command, separate purpose. Default: `bellows-deploy-keys`.
ssh_keys_volume = "bellows-deploy-keys"

# Per-engine credentials volumes (issue #81 / ADR-0005). Each engine
# Bellows can dispatch to has its own Docker named volume holding its
# OAuth session. Seeded via `bellows setup-auth --engine <name>`.
#
# Backwards compat: a flat `auth.credentials_volume = "..."` key (the
# pre-multi-engine shape) continues to work; bellows rewrites it to
# `auth.claude.credentials_volume` at config-load time. An operator
# who never opts in to codex sees no change.
[auth.claude]
credentials_volume = "bellows-claude-credentials"
[auth.codex]
credentials_volume = "bellows-codex-credentials"
# OpenCode (issue #120 / ADR-0008) authenticates with an API key
# rather than an OAuth session, so its auth shape is an env-file
# (mode 0600) rather than a credentials volume. The env-file is
# seeded by `bellows setup-auth --engine opencode` (which reads the
# DEEPSEEK_API_KEY from stdin and writes the canonical
# `DEEPSEEK_API_KEY=...\n` line at the configured path); the
# dispatcher reads it at container-create time (AC11) and injects
# its KEY=VALUE lines into the agent container's env array.
[auth.opencode]
api_key_env_file = "~/.config/bellows/opencode.env"

# Per-phase engine-selection chain (issue #81 / ADR-0005, extended
# by issue #120 / ADR-0008 for opencode). Each agent-invoking phase
# has its own `cli_chain: Vec<...>` declaring the preferred engine
# order. Each entry is either a bare engine name
# (`"claude"`, `"codex"`, `"opencode"`) or an engine-with-model pin
# (`"claude:opus-4-7"`, `"codex:gpt-5.5"`,
# `"opencode:deepseek/deepseek-v4-pro"`). Model is opaque
# pass-through — the CLI reports unknown-model at run time. The
# opencode form's `provider/model` shape is preserved verbatim
# (ChainEntry splits on the FIRST `:` only).
#
# Default-default for each phase is `["claude"]` (slice-#82 chain
# walking + diversity-preference layers on top of the same shape).
# In this slice (#81) bellows always uses the FIRST chain entry; the
# rest of the chain is consulted in slice #82.
#
# The per-issue `engine:claude` / `engine:codex` / `engine:opencode`
# labels override the chain for that run (forced-single-engine).
# Two or more such labels on the same issue = refuse-to-claim.
#
# [phases.implement]
# cli_chain = ["claude:opus-4-7", "codex:gpt-5.5"]
#
# [phases.review]
# cli_chain = ["codex:gpt-5.5", "claude:sonnet-4-6"]
#
# [phases.review_fix]
# cli_chain = ["claude"]
#
# [phases.security_review]
# cli_chain = ["codex"]
#
# [phases.security_fix]
# cli_chain = ["claude", "codex"]
#
# [phases.implement]
# cli_chain = ["opencode:deepseek/deepseek-v4-pro", "claude"]
#
# Phase 8 — merger (issue #123 / ADR-0009 slice 1). Read-only
# end-of-pipeline judgement: reads the diff, the brief's ACs, the
# final agent-notes content, and the cargo-checks gate status, then
# emits a `VERDICT: <MERGE|HOLD-NOTED|HOLD-DRAFT>` line. The verdict
# is logged and stored in run state; routing on it is wired in
# slice 2 (#124).
#
# Default-default for this phase is `["claude:claude-opus-4-7"]`
# (opus is the first-look-judgement role; cross-family independence
# from codex which originates most agent-authored unaddressed-finding
# headings in phase 4).
#
# [phases.merge]
# cli_chain = ["claude:claude-opus-4-7"]
#
# Surfacing the merger's prose review as a "Merge verdict" PR comment
# (issue #125 / ADR-0009 slice 3). After phase 8 completes and the
# verdict has been parsed, bellows posts the merger's full prose body
# (including the trailing `VERDICT: <token>` line) as a comment on
# the PR. The comment is posted before the label transition
# completes so the operator opening the PR sees the verdict alongside
# the agent-done / agent-failed state.
#
# Two modes:
#   - `post-always` (default): every parseable verdict posts a
#     "Merge verdict" comment, including clean MERGE runs. Full
#     audit trail, recommended.
#   - `post-on-hold-only`: only HOLD-NOTED and HOLD-DRAFT verdicts
#     post the comment; MERGE runs auto-merge silently with no
#     comment. Choose this when comment-on-every-MERGE feels noisy.
#
# A `None` merger verdict (slice-1 fallback, e.g. unparseable
# output, merger crash, rate-limit skip) does NOT post a comment
# regardless of this toggle — the audit trail belongs to the
# merger, not to the fallback classifier.
#
# posting = "post-always"

[agent]
# Per-issue wall-clock budget. Bellows tracks elapsed time across all
# container runs in one pipeline (implement, post-implement gate,
# review, review-fix, security-review, security-fix, end-pipeline gate,
# merger); when the budget is spent or
# the deadline fires mid-container, the run halts and routes to a
# draft PR with the `agent-failed` label. Default: 60 minutes.
# Single global cap shared across every configured repo (per-repo
# overrides are out of scope for issue #35).
wall_clock_minutes = 60
# Issue-label that short-circuits the slice-8 weak-test guard. The
# guard scans `git diff <base>...HEAD` after the implement phase and
# routes the run to `agent-self-reported-failure` (draft PR + the
# `agent-failed` label) when no new Rust test attributes are detected.
# Briefs that legitimately produce no new tests (renames, pure
# refactors, dependency bumps) should carry this label so the guard
# skips them. Default: "refactor".
weak_test_guard_skip_label = "refactor"
# How often bellows samples the implement-phase workspace looking for a
# stall (issue #164). Each sample hashes `git diff HEAD` plus the
# untracked-and-not-ignored paths, so `target/` churn is invisible to
# it. Two shapes are classified from the sample sequence:
#   * Oscillation — the workspace returns to a previously-seen state
#     with a different state in between (an edit made, reverted, and
#     made again). No healthy run does this, so it abandons the
#     engine's attempt and advances to the next chain entry.
#   * Idleness — the workspace is unchanged for a prolonged stretch.
#     Recorded in the run log and never acted on: a still workspace is
#     indistinguishable from an engine reasoning about a hard problem
#     or one about to exit cleanly. Default: 60 seconds.
oscillation_sample_seconds = 60
# How much of `wall_clock_minutes` must still remain for an
# oscillation to earn an advance. Handing a fresh engine the last ten
# minutes of an hour wastes them, so below this floor the oscillation
# is logged and the run continues to its existing terminal state. The
# advance allowance itself is shared with the rate-limit trigger and
# capped at one per phase invocation. A fraction between 0.0 and 1.0
# inclusive — anything else is rejected at config-load time.
# Default: 0.5 (half the budget).
advance_budget_floor_fraction = 0.5

[gates]
# ADR-0004 fallback flags for the cargo-checks gate. By default
# bellows parses the target repo's `.github/workflows/*.yml`, finds
# the workflow named `CI`, and runs whatever `cargo clippy` and
# `cargo test` invocations CI runs — verbatim. The invariant is
# "bellows gate passes ⇒ CI gate passes" by construction.
#
# These flags are the FALLBACK applied when bellows cannot parse the
# workflow: there is no `.github/workflows/` directory at all, the
# YAML is malformed, the workflow named `CI` is missing, or the
# clippy / test step is wrapped in a shell script bellows can't
# follow. Each fallback is applied per command — i.e. bellows can
# extract `cargo test` from the workflow but still fall back on
# `cargo clippy` if the latter alone is unparseable.
#
# The clippy default deliberately does NOT deny warnings. It is only
# ever reached when bellows has no evidence of the standard the repo
# holds itself to, and `-D warnings` invents one: a repo with no CI at
# all failed the gate on pre-existing lints in files the agent never
# touched, and the diff was blamed for them. Real clippy errors still
# fail the gate; `cargo test` still gates behaviour.
#
# To hold every target repo to a strict bar regardless of its own CI,
# set the flags explicitly:
#
#   clippy_flags = "--all-targets --all-features -- -D warnings"
#
clippy_flags = "--all-targets --all-features"
test_flags   = "--all-targets --all-features"
